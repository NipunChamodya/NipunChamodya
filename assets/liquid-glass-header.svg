
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img">
  <title>NCK Security Lab — Nipun Chamodya</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030604"/>
      <stop offset="55%" stop-color="#09150C"/>
      <stop offset="100%" stop-color="#020403"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#68E985" stroke-opacity=".09"/>
    </pattern>

    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#68E985" stop-opacity="0"/>
      <stop offset="50%" stop-color="#68E985" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#68E985" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <rect x="20" y="20" width="1160" height="350" rx="14"/>
    </clipPath>
  </defs>

  <rect width="1200" height="390" rx="18" fill="url(#background)"/>

  <g clip-path="url(#clip)">
    <rect x="20" y="20" width="1160" height="350" fill="url(#grid)"/>

    <rect x="20" y="20" width="1160" height="56" fill="#09120C"/>
    <path d="M20 76H1180" stroke="#68E985" stroke-opacity=".4"/>

    <circle cx="47" cy="48" r="5" fill="#68E985"/>
    <circle cx="65" cy="48" r="5" fill="#68E985" opacity=".55"/>
    <circle cx="83" cy="48" r="5" fill="#68E985" opacity=".25"/>

    <text x="105" y="53" fill="#9BBCA2" font-family="monospace" font-size="14" letter-spacing="2">
      NCK / SECURITY LAB
    </text>

    <text x="1150" y="53" text-anchor="end" fill="#68E985" font-family="monospace" font-size="12">
      SYSTEM STATUS: ACTIVE
    </text>

    <text x="66" y="125" fill="#68E985" font-family="monospace" font-size="13" letter-spacing="3">
      SOFTWARE ENGINEERING / SECURITY RESEARCH
    </text>

    <text x="62" y="192" fill="#E7F6EA" font-family="monospace" font-size="52" font-weight="700" letter-spacing="-2">
      NIPUN CHAMODYA
    </text>

    <rect x="65" y="215" width="8" height="25" fill="#68E985">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>

    <text x="86" y="234" fill="#A5FFB2" font-family="monospace" font-size="20" letter-spacing="3">
      CYBERSECURITY RESEARCHER
    </text>

    <text x="66" y="276" fill="#8EA895" font-family="monospace" font-size="13">
      APPLICATION SECURITY / NETWORKING / REVERSE ENGINEERING
    </text>

    <g transform="translate(1000 190)">
      <circle r="78" fill="none" stroke="#68E985" stroke-opacity=".15"/>
      <circle r="59" fill="none" stroke="#68E985" stroke-opacity=".65" stroke-dasharray="4 9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle r="39" fill="#68E985" fill-opacity=".05" stroke="#68E985" stroke-opacity=".65"/>
      <path d="M-67 0H67M0 -67V67M-46 -46L46 46M46 -46L-46 46" stroke="#68E985" stroke-opacity=".25"/>
      <circle r="7" fill="#68E985" filter="url(#glow)">
        <animate attributeName="r" values="5;9;5" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="20" y="82" width="1160" height="2" fill="url(#scan)">
      <animate attributeName="y" values="82;350;82" dur="7s" repeatCount="indefinite"/>
    </rect>

    <path d="M20 337H1180" stroke="#68E985" stroke-opacity=".25"/>

    <text x="45" y="356" fill="#55745D" font-family="monospace" font-size="11">
      [ LAB MODE: ETHICAL ]
    </text>

    <text x="1150" y="356" text-anchor="end" fill="#55745D" font-family="monospace" font-size="11">
      BUILD / TEST / DOCUMENT / REPEAT
    </text>
  </g>

  <rect x="20" y="20" width="1160" height="350" rx="14" fill="none" stroke="#68E985" stroke-opacity=".4"/>
</svg>
